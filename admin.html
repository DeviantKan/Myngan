<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị CHỌN HAY</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="./">CHỌN<span>HAY.</span></a><a href="./">Xem website ↗</a></header><main><small>KHU VỰC QUẢN TRỊ</small><h1>Quản lý sản phẩm</h1><section id="login" class="panel"><h2>Đăng nhập</h2><form id="loginform"><input id="email" type="email" placeholder="Email quản trị" required><input id="password" type="password" placeholder="Mật khẩu" required><button>Đăng nhập</button></form><p id="loginmsg"></p></section><section id="dash" hidden><div class="heading"><h2 id="formtitle">Thêm sản phẩm</h2><button id="logout" class="secondary">Đăng xuất</button></div><form id="productform" class="panel"><input id="pid" type="hidden"><input id="name" placeholder="Tên sản phẩm *" required><div class="two"><input id="category" placeholder="Danh mục *" required><input id="price" placeholder="Giá, ví dụ 299.000đ"></div><div class="two"><input id="oldprice" placeholder="Giá cũ (không bắt buộc)"><input id="tag" placeholder="Nhãn sản phẩm"></div><textarea id="description" placeholder="Mô tả ngắn"></textarea><input id="image" type="url" placeholder="Link ảnh HTTPS *" required><input id="affiliate" type="url" placeholder="Link Affiliate Shopee *" required><div class="two"><button>Lưu sản phẩm</button><button type="button" id="cancel" class="secondary" hidden>Hủy sửa</button></div><p id="savemsg"></p></form><h2>Sản phẩm hiện có</h2><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
